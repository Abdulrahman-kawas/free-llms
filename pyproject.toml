[project]
name = "free-llm"
version = "0.1.0"
description = "Free LLM providers (Gemini, Groq, Z AI, Ollama Cloud, Cloudflare) behind one call, with automatic fallback"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
free-llm = "free_llm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["free_llm"]
